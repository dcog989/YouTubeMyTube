name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bun run build

      - name: Generate release notes
        id: cog
        uses: cocogitto/cocogitto-action@v4
        with:
          command: changelog
          args: --at ${{ github.ref_name }}

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body: ${{ steps.cog.outputs.stdout }}
