name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:coverage
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bun run build
      - run: bun audit
      - uses: actions/upload-artifact@v7
        with:
          name: extension-archives
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
