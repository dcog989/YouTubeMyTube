<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTubeMyTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>

  <body>
    <div class="popup">
      <header class="popup-header">
        <img src="assets/icons/48.png" alt="" width="22" height="22">
        <span>YouTubeMyTube</span>
      </header>

      <div class="row row-between">
        <span class="row-title" data-i18n="blocking">Blocking</span>
        <label
          class="switch"
          for="enabled"
          aria-label="Blocking"
          data-i18n-attr="aria-label:blocking"
        >
          <input type="checkbox" id="enabled">
          <span class="slider"></span>
        </label>
      </div>

      <div class="context" id="context" hidden>
        <div class="row-sub" id="context-label">On this page</div>
        <div class="context-actions">
          <button
            type="button"
            id="block-video"
            class="btn btn-primary"
            hidden
            data-i18n="popupBlockVideo"
          >
            Block this video
          </button>
          <button
            type="button"
            id="block-channel"
            class="btn btn-primary"
            hidden
            data-i18n="popupBlockChannel"
          >
            Block this channel
          </button>
        </div>
      </div>

      <div class="counts" id="counts"></div>

      <button type="button" id="options" class="btn btn-block" data-i18n="popupSettings">
        Settings
      </button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
