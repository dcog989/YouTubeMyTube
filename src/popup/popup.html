<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <img src="assets/icons/48.png" alt="" width="22" height="22">
        <span>YouTube Blocker</span>
      </header>

      <div class="row row-between">
        <span class="row-title">Blocking</span>
        <label class="switch" for="enabled" aria-label="Blocking">
          <input type="checkbox" id="enabled">
          <span class="slider"></span>
        </label>
      </div>

      <div class="context" id="context" hidden>
        <div class="row-sub" id="context-label">On this page</div>
        <div class="context-actions">
          <button type="button" id="block-video" class="btn btn-primary" hidden>
            Block this video
          </button>
          <button type="button" id="block-channel" class="btn btn-primary" hidden>
            Block this channel
          </button>
        </div>
      </div>

      <div class="counts" id="counts"></div>

      <button type="button" id="options" class="btn btn-block">Settings</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
