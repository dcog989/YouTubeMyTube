<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked — YouTube Blocker</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="blocked">
      <img class="blocked-icon" src="assets/icons/128.png" alt="" width="64" height="64" />
      <h1 id="blocked-title">This content is blocked.</h1>
      <p id="blocked-detail" class="blocked-detail"></p>
      <div class="blocked-actions">
        <button type="button" id="blocked-back" class="btn btn-primary">Go back</button>
        <button type="button" id="blocked-home" class="btn">YouTube home</button>
        <button type="button" id="blocked-options" class="btn">Manage blocklist</button>
      </div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
