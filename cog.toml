from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = false
generate_mono_repository_package_tags = false
branch_whitelist = ["main"]
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false
# `package.json` is the build's only version source (the manifests use a `__VERSION__`
# placeholder), so bump it with cog's target version before the version commit is created.
pre_bump_hooks = ["node scripts/sync-version.mjs {{version}}"]
post_bump_hooks = ["git push", "git push origin {{version_tag}}"]
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]
