pre-commit:
  # Sequential: typescript runs after biome --write so bun check sees the formatted files.
  parallel: false
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css,html}"
      run: just format-staged {staged_files}
      stage_fixed: true
    - name: typescript
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc}"
      run: just typecheck

commit-msg:
  jobs:
    - name: conventional-commit
      run: just commit-check {1}
