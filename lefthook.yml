pre-commit:
  # Sequential: typescript runs after biome --write so tsc sees the formatted files.
  parallel: false
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css,html}"
      run: biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typescript
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc}"
      run: tsc --noEmit

commit-msg:
  jobs:
    - name: conventional-commit
      run: cog verify --file {1}
